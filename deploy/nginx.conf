# Navbatchi AI: landing + panel (statik) va API proksi
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 6m;  # Excel import 5 MB gacha

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # Mijoz IP'sini ustiga yozamiz (qo'shmaymiz), shunda login limitini soxta header bilan aylanib o'tib bo'lmaydi
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # test chat LLM javobini kutadi
    }

    location /tg/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /health {
        proxy_pass http://api:8000;
    }

    # Panel SPA: /app/* marshrutlari app/index.html ga tushadi
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }
    location = /app {
        return 301 /app/;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
