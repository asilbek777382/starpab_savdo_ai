services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aiop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiop}
      POSTGRES_DB: aiop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiop"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build: ./backend
    env_file: .env
    environment: &db_env
      DATABASE_URL: postgresql+asyncpg://aiop:${POSTGRES_PASSWORD:-aiop}@postgres:5432/aiop
      REDIS_URL: redis://redis:6379/0
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    env_file: .env
    environment: *db_env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    env_file: .env
    environment: *db_env
    command: ["arq", "app.worker.settings.WorkerSettings"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
